<p>product-list-component works!</p>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Image</th>
        </tr>
    </thead>
    <tbody>
        @for (product of products; track product.id) {
            @if (product.price < 0) {
                <tr class="negative-price">
                    <td>{{ product.id }}</td>
                    <td><a [routerLink]="['/products', product.id]">{{ product.name }}</a></td>
                    <td>{{ product.price }}</td>
                    <td>
                        <a [routerLink]="['/products', product.id]">
                            <img [src]="product.image" [alt]="product.name" width="100">
                        </a>
                    </td>
                </tr>
            } @else {
                <tr>
                    <td>{{ product.id }}</td>
                    <td><a [routerLink]="['/products', product.id]">{{ product.name }}</a></td>
                    <td>{{ product.price }}</td>
                    <td>
                        <a [routerLink]="['/products', product.id]">
                            <img [src]="product.image" [alt]="product.name" width="100">
                        </a>
                    </td>
                </tr>
            }
        } @empty {
            <tr>
                <td colspan="4">No products available.</td>
            </tr>
        }
    </tbody>
</table>
