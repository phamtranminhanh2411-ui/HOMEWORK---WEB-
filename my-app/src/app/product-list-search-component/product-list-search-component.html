<p>product-list-search-component works!</p>
{{errMessage()}}
<label>Giá Min:</label>
<input type="number" [ngModel]="minPrice()" (ngModelChange)="minPrice.set($event)">
<br/>
<label>Giá Max:</label>
<input type="number" [ngModel]="maxPrice()" (ngModelChange)="maxPrice.set($event)">
<br/>
<button (click)="onFilter()">Lọc sản phẩm</button>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Details</th>
      <th>Slug</th>
    </tr>
  </thead>
  <tbody>
    @for (p of filteredProducts(); track p.id) {
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.price }}</td>
      <td>
        <a (click)="viewDetail(p.id)"
        style="cursor: pointer;"
        title="click here to view detail" >View detail</a>
      </td>
      <td>
        <span
          (click)="viewDetailSlug(p)"
          style="cursor: pointer;"
          title="Click to view product detail">
          {{ generateSlug(p.name, p.id) }}
        </span>
      </td>
    </tr>
  } @empty {
    <tr>
      <td colspan="5">No products available.</td>
    </tr>
  }
  </tbody>
</table>
